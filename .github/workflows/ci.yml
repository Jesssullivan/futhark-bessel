name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93
      - name: Evaluate pinned flake
        run: nix flake check --no-build
      - name: Run repository gate
        run: nix develop --command just check
